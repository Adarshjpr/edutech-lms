spring.application.name=lms
spring.datasource.url=jdbc:mysql://localhost:3307/edutech
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---------------- Flyway Config ----------------
spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://localhost:3307/edutech
spring.flyway.user=root
spring.flyway.password=root
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true


# =======  env =========

app.random.chars=ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata



# Handler 11 chalane ke liye zaroori
spring.mvc.throw-exception-if-no-handler-found=true

# File upload limits (Handler 9)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Logging
logging.level.com.uncodemy.lms=DEBUG

# ================= AWS SES =================
aws.region=ap-south-1

# Credentials — LOCAL DEV ke liye.
# Production me ye khali chhodo aur IAM Role use karo (neeche samjhaya hai).
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# ================= MAIL SETTINGS =================
# Ye email tumhare VERIFIED DOMAIN ka hona chahiye
app.mail.from=no-reply@uncodemy.com
app.mail.from-name=Uncodemy LMS

# Reply karne pe kahan jaye (asli inbox)
app.mail.reply-to=support@uncodemy.com

# Development me true kar do -> mail sach me nahi jayegi,
# sirf console pe print hogi. Testing me paise aur quota bachega.
app.mail.dry-run=false
